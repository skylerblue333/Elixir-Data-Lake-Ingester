name: elixir-ingester-ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27.2'
          elixir-version: '1.17.3'
      - name: Format
        run: mix format --check-formatted
      - name: Compile warnings as errors
        run: mix compile --warnings-as-errors
      - name: Test
        run: mix test
      - name: Build escript
        run: mix escript.build
      - name: Build image
        run: docker build -t sky-elixir-ingester:ci .
      - name: Verify non-root image
        run: test "$(docker image inspect sky-elixir-ingester:ci --format '{{.Config.User}}')" = "10001:10001"
      - name: Smoke startup
        run: docker run --rm sky-elixir-ingester:ci | grep '"status":"ready"'
